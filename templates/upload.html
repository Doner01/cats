{% extends "base.html" %}

{% block title %}Upload Cat Photo | CatRank{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/90 shadow-xl mt-2 space-y-6">
    <div class="text-center space-y-1.5">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-indigo-50 border border-indigo-100 text-indigo-600 flex items-center justify-center text-2xl shadow-xs">
            <i class="fa-solid fa-cloud-arrow-up"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight" data-i18n="upload_page_title">Upload Cat Photo</h1>
        <p class="text-xs text-slate-500 flex items-center justify-center gap-1">
            <i class="fa-solid fa-bolt text-amber-500 text-[10px]"></i>
            <span data-i18n="upload_daily_limit">Share your cat photo and join the community leaderboard!</span>
        </p>
    </div>

    <form id="upload-form" class="space-y-4">
        
        <div class="space-y-1.5">
            <label for="cat-name" class="block text-xs font-bold text-slate-700 flex items-center gap-1.5" data-i18n="cat_name_label">
                <i class="fa-solid fa-tag text-indigo-500 text-xs"></i>
                <span>Cat Name</span>
            </label>
            <input type="text" id="cat-name" required maxlength="80" placeholder="e.g. Luna, Simba, Mochi, Barsik" data-i18n-placeholder="cat_name_placeholder" class="w-full px-4 py-2.5 text-xs font-medium border border-slate-200 bg-slate-50 hover:bg-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner transition">
        </div>

        <div class="space-y-1.5">
            <div class="flex items-center justify-between">
                <label for="cat-bio" class="block text-xs font-bold text-slate-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-quote-left text-indigo-500 text-xs"></i>
                    <span data-i18n="cat_bio_label">Cat Bio / Story (Optional)</span>
                </label>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider bg-slate-100 px-2 py-0.5 rounded-full" data-i18n="optional_badge">Optional</span>
            </div>
            <textarea id="cat-bio" rows="2" maxlength="1000" placeholder="Tell us about your cat's personality, favorite habits, or story..." data-i18n-placeholder="cat_bio_placeholder" class="w-full px-4 py-2.5 text-xs font-medium border border-slate-200 bg-slate-50 hover:bg-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner transition"></textarea>
        </div>

        <div class="space-y-1.5">
            <label for="cat-file" class="block text-xs font-bold text-slate-700 flex items-center gap-1.5" data-i18n="photo_label">
                <i class="fa-solid fa-image text-indigo-500 text-xs"></i>
                <span>Photo (PNG, JPG, WEBP, max 5MB)</span>
            </label>
            <div id="drop-zone" class="border-2 border-dashed border-slate-200 hover:border-indigo-400 rounded-2xl p-6 text-center cursor-pointer transition bg-slate-50/50 hover:bg-slate-50">
                <input type="file" id="cat-file" aria-label="Cat photo" accept="image/png, image/jpeg, image/webp, image/gif" class="hidden">
                <button type="button" onclick="document.getElementById('cat-file').click()" class="space-y-1.5 w-full">
                    <i class="fa-solid fa-arrow-up-from-bracket text-2xl text-slate-400"></i>
                    <p class="text-xs font-bold text-slate-700" data-i18n="drop_drag_text">Click to browse or drag & drop</p>
                    <p class="text-[10px] text-slate-400" data-i18n="drop_format_text">JPG, PNG, WEBP or GIF up to 5MB</p>
                </button>
            </div>
        </div>

        <div id="preview-container" class="hidden space-y-1.5 animate-in fade-in duration-150">
            <div class="flex items-center justify-between">
                <label class="block text-xs font-bold text-slate-700" data-i18n="preview_label">Preview</label>
                <button type="button" onclick="clearUploadPreview()" class="text-xs text-rose-600 font-bold hover:underline flex items-center gap-1">
                    <i class="fa-solid fa-trash-can text-[10px]"></i>
                    <span data-i18n="remove_preview_btn">Remove</span>
                </button>
            </div>
            <div class="cat-img-wrapper rounded-2xl overflow-hidden border border-slate-200 shadow-xs relative bg-slate-900">
                <img id="image-preview" src="#" alt="Preview" class="w-full h-full object-contain">
            </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold text-xs uppercase tracking-wider rounded-2xl transition shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2 transform hover:-translate-y-0.5" data-i18n="upload_submit_btn">
            <i class="fa-solid fa-cloud-arrow-up text-xs"></i>
            <span>Upload Photo</span>
        </button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ asset_url('js/upload.js') }}"></script>
<script>
function clearUploadPreview() {
    const fileInput = document.getElementById("cat-file");
    const previewContainer = document.getElementById("preview-container");
    const imgPreview = document.getElementById("image-preview");
    if (fileInput) fileInput.value = "";
    if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
    previewObjectUrl = null;
    if (imgPreview) imgPreview.removeAttribute("src");
    if (previewContainer) previewContainer.classList.add("hidden");
}
</script>
{% endblock %}
