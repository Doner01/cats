{% extends "base.html" %}

{% block title %}Sign In | CatRank{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/90 shadow-sm mt-4 space-y-6">
    <div class="text-center space-y-1.5">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-indigo-50 border border-indigo-100 text-indigo-600 flex items-center justify-center text-2xl shadow-xs">
            <i class="fa-solid fa-cat"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight" data-i18n="welcome_back_title">Welcome Back</h1>
        <p class="text-xs text-slate-500" data-i18n="login_subtitle">Sign in to vote, comment, and upload cat pictures</p>
    </div>

    <form onsubmit="event.preventDefault(); handleLogin();" class="space-y-4">
        <div class="space-y-1.5">
            <label class="block text-xs font-bold text-slate-700 flex items-center gap-1.5" data-i18n="email_label">
                <i class="fa-solid fa-envelope text-indigo-500 text-xs"></i>
                <span>Email Address</span>
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-at text-xs"></i>
                </div>
                <input type="email" id="email" required placeholder="you@example.com" class="w-full pl-9 pr-4 py-2.5 text-xs font-medium border border-slate-200 bg-slate-50 hover:bg-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner transition">
            </div>
        </div>

        <div class="space-y-1.5">
            <label class="block text-xs font-bold text-slate-700 flex items-center gap-1.5" data-i18n="password_label">
                <i class="fa-solid fa-lock text-indigo-500 text-xs"></i>
                <span>Password</span>
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-key text-xs"></i>
                </div>
                <input type="password" id="password" required placeholder="••••••••" class="w-full pl-9 pr-10 py-2.5 text-xs font-medium border border-slate-200 bg-slate-50 hover:bg-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner transition">
                <button type="button" onclick="togglePasswordVisibility('password', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition focus:outline-none" title="Toggle password visibility">
                    <i class="fa-solid fa-eye text-xs"></i>
                </button>
            </div>
        </div>

        <div class="pt-2">
            <button type="submit" id="login-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold text-xs uppercase tracking-wider rounded-2xl transition shadow-md shadow-indigo-500/20 flex items-center justify-center gap-2 transform hover:-translate-y-0.5" data-i18n="signin_submit_btn">
                <i class="fa-solid fa-right-to-bracket text-xs"></i>
                <span>Sign In</span>
            </button>
        </div>
    </form>

    <div class="pt-4 border-t border-slate-100 text-center text-xs text-slate-500 flex flex-col sm:flex-row items-center justify-center gap-1.5">
        <span data-i18n="no_account_text">Don't have an account?</span>
        <a href="/register" class="font-bold text-indigo-600 hover:underline transition flex items-center gap-1" data-i18n="goto_register_link">
            <span>Create an account / Sign Up</span>
            <i class="fa-solid fa-arrow-right text-[10px]"></i>
        </a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    const icon = btn.querySelector('i');
    if (icon) {
        icon.className = isPassword ? 'fa-solid fa-eye-slash text-xs text-indigo-600' : 'fa-solid fa-eye text-xs';
    }
}
</script>
{% endblock %}
