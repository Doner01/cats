{% extends "base.html" %}

{% block title %}User Profile | CatRank{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-8">
    <!-- User Profile Header Card -->
    <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/90 shadow-sm relative overflow-hidden flex flex-col sm:flex-row items-center sm:items-start gap-6">
        <!-- Profile Avatar with live hover edit trigger for owner -->
        <div class="relative group/avatar flex-shrink-0">
            <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-3xl overflow-hidden border-2 border-indigo-100 shadow-md bg-slate-50 relative">
                <img id="profile-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=CatLover&backgroundColor=b6e3f4,c0aede,d1d4f9" alt="Profile avatar" class="w-full h-full object-cover">
                
                <!-- Owner overlay edit button -->
                <button id="avatar-edit-overlay-btn" onclick="openEditProfileModal()" class="hidden absolute inset-0 bg-black/50 text-white flex-col items-center justify-center gap-1 opacity-0 group-hover/avatar:opacity-100 transition-opacity duration-200 cursor-pointer">
                    <i class="fa-solid fa-camera text-base"></i>
                    <span class="text-[10px] font-bold" data-i18n="change_photo">Change</span>
                </button>
            </div>

            <button id="avatar-badge-btn" onclick="openEditProfileModal()" class="hidden absolute -bottom-2 -right-2 w-8 h-8 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white flex items-center justify-center shadow-md transition transform hover:scale-110" title="Edit Profile" data-i18n-title="edit_profile_btn">
                <i class="fa-solid fa-pen text-xs"></i>
            </button>
        </div>

        <!-- Profile Details & Live Counts -->
        <div class="flex-grow text-center sm:text-left space-y-2 min-w-0">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                    <h1 id="profile-name" class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight truncate">Loading...</h1>
                    <p id="profile-bio" class="text-xs sm:text-sm text-slate-500 font-medium mt-0.5" data-i18n="profile_bio_default">CatRank Member • Cat enthusiast</p>
                </div>
                
                <!-- Profile Action Buttons Container -->
                <div id="profile-actions" class="flex items-center justify-center sm:justify-end gap-2 flex-shrink-0">
                    <!-- Injected dynamically based on isSelf -->
                </div>
            </div>

            <!-- Stats Bar -->
            <div class="pt-4 flex items-center justify-center sm:justify-start gap-6 border-t border-slate-100">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xs shadow-xs">
                        <i class="fa-solid fa-images"></i>
                    </div>
                    <div>
                        <div id="stat-uploaded-count" class="text-base font-black text-slate-900 leading-none">0</div>
                        <div class="text-[11px] text-slate-400 font-bold uppercase tracking-wider" data-i18n="stat_uploads">Uploads</div>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-xs shadow-xs">
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div>
                        <div id="stat-likes-count" class="text-base font-black text-slate-900 leading-none">0</div>
                        <div class="text-[11px] text-slate-400 font-bold uppercase tracking-wider" data-i18n="stat_total_votes">Total Votes</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- User Uploaded Cats Section -->
    <div class="space-y-4">
        <div class="flex items-center justify-between border-b border-slate-200/80 pb-3">
            <h2 class="text-lg font-black text-slate-900 tracking-tight flex items-center gap-2" data-i18n="profile_uploads_heading">
                <i class="fa-solid fa-images text-indigo-500"></i>
                <span>Uploaded Cats</span>
            </h2>
        </div>

        <div id="user-cats-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- Dynamically injected cards -->
            <div class="col-span-full py-16 text-center text-slate-400 bg-white rounded-3xl border border-dashed border-slate-200">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-indigo-500"></i>
                <p class="text-xs font-medium" data-i18n="loading_profile_cats">Loading cats...</p>
            </div>
        </div>
    </div>
</div>

<!-- Edit Profile Modal -->
<div id="edit-profile-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-5 animate-in fade-in duration-200">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <h3 class="text-lg font-black text-slate-900 flex items-center gap-2" data-i18n="edit_profile_title">
                <i class="fa-solid fa-user-pen text-indigo-600"></i>
                <span>Edit Profile</span>
            </h3>
            <button onclick="closeEditProfileModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center font-bold text-sm transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form id="edit-profile-form" onsubmit="event.preventDefault(); saveProfileChanges();" class="space-y-4">
            <!-- Display Name -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-700" data-i18n="display_name_label">Display Name / Username</label>
                <input type="text" id="edit-display-name" required maxlength="40" placeholder="e.g. CatLover99" class="w-full px-4 py-2.5 text-xs font-medium border border-slate-200 bg-slate-50 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner">
            </div>

            <!-- Avatar Upload or Reset -->
            <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-700" data-i18n="profile_photo_label">Profile Photo</label>
                <div class="flex items-center gap-3">
                    <img id="edit-avatar-preview" src="#" alt="Preview" class="w-14 h-14 rounded-2xl border border-slate-200 object-cover bg-slate-50 flex-shrink-0 shadow-xs">
                    <div class="flex flex-col gap-1.5 flex-grow">
                        <label for="edit-avatar-file" class="px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold rounded-xl transition cursor-pointer text-center border border-indigo-200/60 shadow-xs flex items-center justify-center gap-1.5" data-i18n="upload_new_photo">
                            <i class="fa-solid fa-cloud-arrow-up text-xs"></i>
                            <span>Choose Photo</span>
                        </label>
                        <input type="file" id="edit-avatar-file" accept="image/png,image/jpeg,image/webp" onchange="handleAvatarFileSelect(event)" class="hidden">
                        
                        <button type="button" onclick="resetToDefaultAvatar()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 text-[11px] font-bold rounded-xl transition flex items-center justify-center gap-1" data-i18n="btn_default_avatar">
                            <i class="fa-solid fa-rotate-left text-[10px]"></i>
                            <span>Reset Default</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-end gap-2.5 pt-4 border-t border-slate-100">
                <button type="button" onclick="closeEditProfileModal()" class="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-100 text-xs font-bold transition" data-i18n="cancel_modal_btn">Cancel</button>
                <button type="submit" id="save-profile-btn" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition shadow-md flex items-center gap-1.5" data-i18n="save_changes_btn">
                    <i class="fa-solid fa-check text-xs"></i>
                    <span>Save Changes</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script>
const targetUserId = "{{ view_user_id }}";
let isResetAvatarChosen = false;
let currentProfileAvatarUrl = "";

async function loadProfile() {
    let session = null;
    if (typeof supabaseClient !== "undefined" && supabaseClient) {
        try {
            const sessRes = await supabaseClient.auth.getSession();
            session = sessRes && sessRes.data ? sessRes.data.session : null;
        } catch (e) {
            console.warn("Session check error:", e);
        }
    }

    const isSelf = (!targetUserId && session && session.user) || (session && session.user && String(session.user.id) === String(targetUserId));
    const userIdToLoad = targetUserId || (session && session.user ? session.user.id : null);

    if (!userIdToLoad) {
        showToast(typeof t === "function" ? t("toast_need_signin_vote") : "Please sign in to view your profile.", "info");
        setTimeout(() => window.location.href = "/login", 800);
        return;
    }

    const nameElem = document.getElementById("profile-name");
    const avatarElem = document.getElementById("profile-avatar");
    const actionsElem = document.getElementById("profile-actions");
    const editOverlayBtn = document.getElementById("avatar-edit-overlay-btn");
    const avatarBadgeBtn = document.getElementById("avatar-badge-btn");

    if (isSelf && session && session.user) {
        const displayName = getUserDisplayName(session.user);
        nameElem.innerText = displayName;
        currentProfileAvatarUrl = getAvatarUrl(session.user);
        avatarElem.src = currentProfileAvatarUrl;
        avatarElem.onerror = function() { handleAvatarError(this, displayName); };

        if (editOverlayBtn) {
            editOverlayBtn.classList.remove("hidden");
            editOverlayBtn.classList.add("flex");
        }
        if (avatarBadgeBtn) {
            avatarBadgeBtn.classList.remove("hidden");
            avatarBadgeBtn.classList.add("flex");
        }

        const editProfileText = typeof t === "function" ? t("edit_profile_btn") : "Edit Profile";
        const uploadCatText = typeof t === "function" ? t("nav_upload") : "Upload Cat";

        actionsElem.innerHTML = `
            <button onclick="openEditProfileModal()" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition shadow-xs flex items-center gap-1.5">
                <i class="fa-solid fa-pen-to-square text-xs text-slate-500"></i>
                <span>${editProfileText}</span>
            </button>
            <a href="/upload" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow-xs transition inline-flex items-center gap-1.5">
                <i class="fa-solid fa-cloud-arrow-up text-xs"></i>
                <span>${uploadCatText}</span>
            </a>
        `;
    } else {
        if (editOverlayBtn) editOverlayBtn.classList.add("hidden");
        if (avatarBadgeBtn) avatarBadgeBtn.classList.add("hidden");
        actionsElem.innerHTML = "";
    }

    try {
        const res = await fetch(`/api/user/${encodeURIComponent(userIdToLoad)}/profile`);
        const data = await res.json();
        const cats = data.cats || [];

        if (!isSelf) {
            const userName = data.user_name || "Cat Lover";
            nameElem.innerText = userName;
            const fallbackAvatar = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(userName)}&backgroundColor=b6e3f4,c0aede,d1d4f9`;
            avatarElem.src = data.user_avatar || fallbackAvatar;
            avatarElem.onerror = function() { handleAvatarError(this, userName); };
        }

        document.getElementById("stat-uploaded-count").innerText = cats.length;
        document.getElementById("stat-likes-count").innerText = data.total_likes || 0;

        const grid = document.getElementById("user-cats-grid");
        if (cats.length === 0) {
            const noCatsText = typeof t === "function" ? t("no_cats_title") : "No cats uploaded yet";
            const noCatsDesc = typeof t === "function" ? t("no_cats_desc") : "Be the first to share your feline friend!";
            grid.innerHTML = `
                <div class="col-span-full py-16 text-center bg-white rounded-3xl border border-dashed border-slate-300 space-y-2">
                    <i class="fa-solid fa-cat text-4xl text-slate-300 mb-1"></i>
                    <h3 class="font-bold text-slate-800 text-sm">${noCatsText}</h3>
                    <p class="text-xs text-slate-400">${noCatsDesc}</p>
                </div>
            `;
            return;
        }

        const deleteText = typeof t === "function" ? t("delete_btn") : "Delete";
        grid.innerHTML = cats.map(cat => `
            <div id="cat-card-${cat.id}" onclick="openCatModal('${cat.id}')" class="cat-card bg-white rounded-3xl border border-slate-200/90 overflow-hidden shadow-xs hover:shadow-lg transition-all duration-300 cursor-pointer relative group flex flex-col justify-between">
                <div class="cat-img-wrapper bg-slate-100 relative overflow-hidden">
                    <img src="${cat.image_url}" alt="${cat.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                    ${isSelf ? `
                        <button onclick="deleteCat('${cat.id}', event)" class="absolute top-3 right-3 p-2 rounded-xl bg-white/90 hover:bg-rose-600 text-slate-600 hover:text-white backdrop-blur shadow-sm transition z-10" title="${deleteText}">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    ` : ''}
                </div>
                <div class="p-4 flex items-center justify-between">
                    <div class="min-w-0 pr-2">
                        <h4 class="font-bold text-slate-900 text-sm truncate">${cat.name}</h4>
                        <p class="text-[10px] text-slate-400 mt-0.5 flex items-center gap-1">
                            <i class="fa-regular fa-calendar text-[9px]"></i>
                            <span>${(cat.created_at || '').slice(0, 10)}</span>
                        </p>
                    </div>
                    <div class="flex items-center gap-1 text-xs font-black text-rose-600 bg-rose-50 px-2.5 py-1 rounded-full border border-rose-100 flex-shrink-0">
                        <i class="fa-solid fa-heart text-[10px]"></i>
                        <span>${cat.likes_count}</span>
                    </div>
                </div>
            </div>
        `).join("");
    } catch (e) {
        showToast("Failed to load profile", "error");
    }
}

function openEditProfileModal() {
    isResetAvatarChosen = false;
    document.getElementById("edit-profile-modal").classList.remove("hidden");
    const fileInput = document.getElementById("edit-avatar-file");
    if (fileInput) fileInput.value = "";
    
    const preview = document.getElementById("edit-avatar-preview");
    if (preview) preview.src = currentProfileAvatarUrl || document.getElementById("profile-avatar").src;

    if (currentSession && currentSession.user) {
        const nameInput = document.getElementById("edit-display-name");
        if (nameInput) nameInput.value = getUserDisplayName(currentSession.user);
    }
}

function closeEditProfileModal() {
    document.getElementById("edit-profile-modal").classList.add("hidden");
}

function handleAvatarFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    if (file.size > 5 * 1024 * 1024) {
        showToast("Image size must be under 5MB.", "error");
        event.target.value = "";
        return;
    }

    isResetAvatarChosen = false;
    const reader = new FileReader();
    reader.onload = (e) => {
        const preview = document.getElementById("edit-avatar-preview");
        if (preview) preview.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function resetToDefaultAvatar() {
    isResetAvatarChosen = true;
    const nameInput = document.getElementById("edit-display-name");
    const name = (nameInput && nameInput.value.trim()) || "CatLover";
    const defaultUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(name)}&backgroundColor=b6e3f4,c0aede,d1d4f9`;
    
    const preview = document.getElementById("edit-avatar-preview");
    if (preview) preview.src = defaultUrl;
    
    const fileInput = document.getElementById("edit-avatar-file");
    if (fileInput) fileInput.value = "";
    showToast(typeof t === "function" ? t("btn_default_avatar") : "Avatar reset to default avatar preview", "info");
}

async function saveProfileChanges() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
        showToast("Please sign in.", "error");
        return;
    }

    const nameInput = document.getElementById("edit-display-name");
    const fileInput = document.getElementById("edit-avatar-file");
    const btn = document.getElementById("save-profile-btn");

    const newDisplayName = nameInput.value.trim();
    if (!newDisplayName) {
        showToast("Please enter a display name.", "error");
        return;
    }

    if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-xs"></i> <span>${typeof t === "function" ? t("uploading_btn") : "Saving..."}</span>`;
    }

    try {
        let finalAvatarUrl = currentProfileAvatarUrl;

        // 1. If file uploaded, send to server
        if (fileInput.files && fileInput.files.length > 0) {
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            const uploadRes = await fetch("/api/user/avatar", {
                method: "POST",
                headers: { "Authorization": `Bearer ${session.access_token}` },
                body: formData
            });

            const uploadData = await uploadRes.json();
            if (!uploadRes.ok) {
                throw new Error(uploadData.error || "Failed to upload avatar image.");
            }
            finalAvatarUrl = uploadData.avatar_url;
        } else if (isResetAvatarChosen) {
            finalAvatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(newDisplayName)}&backgroundColor=b6e3f4,c0aede,d1d4f9`;
        }

        // 2. Update Supabase Auth User Metadata
        await supabaseClient.auth.updateUser({
            data: {
                display_name: newDisplayName,
                avatar_url: finalAvatarUrl
            }
        });

        // 3. Sync to backend database
        const syncCall = await fetch("/api/user/profile", {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${session.access_token}`
            },
            body: JSON.stringify({
                display_name: newDisplayName,
                avatar_url: finalAvatarUrl
            })
        });

        showToast(typeof t === "function" ? t("toast_profile_synced") : "Profile updated successfully! ✓", "success");
        closeEditProfileModal();
        setTimeout(() => window.location.reload(), 500);

    } catch (err) {
        showToast("Error updating profile: " + err.message, "error");
    } finally {
        if (btn) {
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-check text-xs"></i> <span>${typeof t === "function" ? t("save_changes_btn") : "Save Changes"}</span>`;
        }
    }
}

window.addEventListener("catrank_language_changed", loadProfile);
document.addEventListener("DOMContentLoaded", loadProfile);
</script>
{% endblock %}
