<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CatRank | Modern Cat Voting & Leaderboard{% endblock %}</title>
    
    <!-- Dynamic SVG Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Global Avatar Fallback Handler -->
    <script>
        function getFallbackAvatarSvg(name) {
            const safeName = (name || 'Cat').trim();
            const initial = safeName.charAt(0).toUpperCase() || 'C';
            const colors = ['#6366f1', '#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#06b6d4', '#4f46e5', '#d946ef'];
            let hash = 0;
            for (let i = 0; i < safeName.length; i++) {
                hash = safeName.charCodeAt(i) + ((hash << 5) - hash);
            }
            const color = colors[Math.abs(hash) % colors.length];
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><rect width="100" height="100" rx="50" fill="${color}"/><text x="50" y="58" font-size="44" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">${initial}</text></svg>`;
            return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
        }

        function handleAvatarError(imgElem, name = "Cat") {
            if (!imgElem) return;
            imgElem.onerror = null;
            imgElem.src = getFallbackAvatarSvg(name);
        }
    </script>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "{{ supabase_url }}";
        const SUPABASE_ANON_KEY = "{{ supabase_anon_key }}";
        let supabaseClient = null;
        if (SUPABASE_URL && SUPABASE_ANON_KEY) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
    </script>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white">
    <!-- Modern Navigation Bar -->
    <header class="glass-nav sticky top-0 z-40 transition-all shadow-xs">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
            <!-- Brand Logo -->
            <a href="/" class="flex items-center gap-2.5 font-black text-xl text-indigo-600 tracking-tight hover:opacity-90 transition flex-shrink-0 group">
                <div class="w-9 h-9 rounded-2xl bg-indigo-600 text-white flex items-center justify-center shadow-md shadow-indigo-500/20 group-hover:scale-105 transition transform">
                    <i class="fa-solid fa-cat text-lg"></i>
                </div>
                <span class="bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-700 bg-clip-text text-transparent font-black" data-i18n="nav_brand">CatRank</span>
            </a>
            
            <!-- Desktop Navigation Links -->
            <nav class="nav-desktop-links hidden sm:flex items-center gap-2">
                <a href="/" class="px-3 py-2 text-xs font-bold text-slate-600 hover:text-indigo-600 hover:bg-slate-100 rounded-xl transition flex items-center gap-1.5">
                    <i class="fa-solid fa-house text-xs text-indigo-500"></i>
                    <span data-i18n="nav_feed">Feed</span>
                </a>
                <a href="/leaderboard" class="px-3 py-2 text-xs font-bold text-slate-600 hover:text-indigo-600 hover:bg-slate-100 rounded-xl transition flex items-center gap-1.5">
                    <i class="fa-solid fa-trophy text-xs text-amber-500"></i>
                    <span data-i18n="nav_leaderboard">Leaderboard</span>
                </a>
                <a href="/upload" class="px-3.5 py-2 text-xs font-black text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 rounded-xl transition flex items-center gap-1.5 shadow-md shadow-indigo-500/20 transform hover:-translate-y-0.5">
                    <i class="fa-solid fa-cloud-arrow-up text-xs"></i>
                    <span data-i18n="nav_upload">Upload Cat</span>
                </a>
            </nav>

            <!-- Right Controls: Language, Notifications, Auth Profile -->
            <div class="flex items-center gap-2 sm:gap-3 flex-shrink-0">
                <!-- Bilingual Language Switcher (EN / RU) -->
                <div class="flex items-center bg-slate-100 p-0.5 rounded-xl border border-slate-200 shadow-2xs">
                    <button onclick="setLanguage('en')" class="lang-btn-en px-2.5 py-1 text-xs font-black bg-indigo-600 text-white rounded-lg shadow-sm transition" title="English">EN</button>
                    <button onclick="setLanguage('ru')" class="lang-btn-ru px-2.5 py-1 text-xs font-bold text-slate-700 hover:text-indigo-600 rounded-lg transition" title="Русский">RU</button>
                </div>

                <!-- Notifications Bell -->
                <div class="relative" id="notifications-dropdown-wrapper">
                    <button onclick="toggleNotificationsDropdown()" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 hover:text-slate-900 border border-slate-200 flex items-center justify-center transition shadow-2xs relative" title="Notifications" data-i18n-title="nav_notifications">
                        <i class="fa-solid fa-bell text-xs"></i>
                        <span id="notif-badge" class="hidden absolute -top-1 -right-1 w-4 h-4 rounded-full bg-rose-500 text-white text-[9px] font-black flex items-center justify-center border-2 border-white animate-pulse">0</span>
                    </button>

                    <!-- Notifications Dropdown Panel -->
                    <div id="notifications-dropdown" class="hidden absolute right-0 mt-2 w-80 sm:w-88 bg-white rounded-3xl border border-slate-200 shadow-2xl overflow-hidden z-50 animate-in fade-in zoom-in-95 duration-150">
                        <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/80">
                            <div class="flex items-center gap-2">
                                <i class="fa-solid fa-bell text-indigo-500 text-xs"></i>
                                <span class="font-extrabold text-slate-900 text-xs" data-i18n="notifications_title">Notifications</span>
                            </div>
                            <button onclick="markAllNotificationsRead()" class="text-[11px] font-bold text-indigo-600 hover:underline transition" data-i18n="notif_mark_read">Mark all read</button>
                        </div>
                        <div id="notifications-list" class="max-h-72 overflow-y-auto divide-y divide-slate-100 text-xs">
                            <div class="p-8 text-center text-slate-400" data-i18n="notif_empty">No notifications yet</div>
                        </div>
                    </div>
                </div>

                <!-- User Auth Section -->
                <div id="auth-section" class="flex items-center gap-1.5">
                    <!-- Populated dynamically by auth.js -->
                    <a href="/login" class="px-3 py-1.5 text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition flex items-center gap-1.5" data-i18n="nav_signin">
                        <i class="fa-solid fa-right-to-bracket text-xs text-slate-500"></i>
                        <span>Sign In</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-6 container-mobile-padded">
        {% block content %}{% endblock %}
    </main>

    <!-- Sleek Mobile Bottom Navigation Bar (Phones < 640px) -->
    <div class="mobile-bottom-nav sm:hidden">
        <a href="/" class="flex flex-col items-center justify-center gap-1 text-slate-600 hover:text-indigo-600 transition">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] font-bold" data-i18n="mobile_nav_feed">Feed</span>
        </a>
        <a href="/leaderboard" class="flex flex-col items-center justify-center gap-1 text-slate-600 hover:text-amber-500 transition">
            <i class="fa-solid fa-trophy text-base"></i>
            <span class="text-[10px] font-bold" data-i18n="mobile_nav_leaderboard">Rankings</span>
        </a>
        <a href="/upload" class="flex flex-col items-center justify-center -mt-4">
            <div class="w-12 h-12 rounded-full bg-indigo-600 text-white flex items-center justify-center shadow-lg shadow-indigo-500/30 border-2 border-white transform active:scale-95 transition">
                <i class="fa-solid fa-plus text-lg"></i>
            </div>
            <span class="text-[10px] font-black text-indigo-600 mt-0.5" data-i18n="mobile_nav_upload">Upload</span>
        </a>
        <a href="/profile" class="flex flex-col items-center justify-center gap-1 text-slate-600 hover:text-indigo-600 transition">
            <i class="fa-solid fa-user text-base"></i>
            <span class="text-[10px] font-bold" data-i18n="mobile_nav_profile">Account</span>
        </a>
    </div>

    <!-- Cat Detail & Interactive Comments Modal -->
    <div id="cat-detail-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 modal-backdrop">
        <div class="bg-white rounded-3xl border border-slate-200 max-w-2xl w-full p-5 sm:p-6 shadow-2xl space-y-4 animate-in fade-in zoom-in-95 duration-150 max-h-[92vh] overflow-y-auto modal-dialog-responsive">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <div class="flex items-center gap-2 min-w-0">
                    <h3 id="modal-cat-name" class="text-lg font-black text-slate-900 truncate">Cat Name</h3>
                    <span id="modal-comments-count-badge" class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold bg-indigo-50 text-indigo-600 flex-shrink-0">0 comments</span>
                </div>
                <button onclick="closeCatModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition flex-shrink-0">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <!-- Cat Image View -->
            <div class="cat-img-wrapper rounded-2xl overflow-hidden border border-slate-200 shadow-sm relative bg-slate-900 max-h-80">
                <img id="modal-cat-img" src="" alt="Cat Photo" class="w-full h-full object-contain">
            </div>

            <!-- Cat Bio / Story Display (if available) -->
            <div id="modal-cat-bio-box" class="hidden p-3.5 bg-slate-50 rounded-2xl border border-slate-100 text-xs text-slate-700 leading-relaxed">
                <div class="flex items-center gap-1.5 font-bold text-slate-900 mb-1">
                    <i class="fa-solid fa-quote-left text-indigo-500 text-xs"></i>
                    <span data-i18n="cat_story_title">About this cat</span>
                </div>
                <p id="modal-cat-bio-text" class="italic text-slate-600"></p>
            </div>

            <!-- Comments Section -->
            <div class="space-y-3 pt-2">
                <div class="flex items-center justify-between">
                    <h4 class="text-xs font-black text-slate-900 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-comments text-indigo-500"></i>
                        <span data-i18n="modal_comments_heading">Comments</span>
                        <span id="modal-comments-count" class="text-slate-400 font-bold">(0)</span>
                    </h4>
                </div>

                <!-- Comments List (Single-Depth Threaded Replies Matching image_78cc63) -->
                <div id="modal-comments-list" class="space-y-3 max-h-60 overflow-y-auto pr-1">
                    <p class="text-xs text-slate-400 py-6 text-center" data-i18n="loading_comments">Loading comments...</p>
                </div>

                <!-- Reply Active Banner -->
                <div id="modal-reply-banner" class="hidden flex items-center justify-between bg-indigo-50/90 border border-indigo-200 px-3 py-1.5 rounded-xl text-xs">
                    <div class="flex items-center gap-1.5 text-indigo-800 font-bold">
                        <i class="fa-solid fa-reply text-xs"></i>
                        <span data-i18n="replying_to">Replying to</span>
                        <span id="modal-reply-target-name" class="font-black text-indigo-600">@User</span>
                    </div>
                    <button onclick="cancelReply()" class="text-xs text-slate-500 hover:text-rose-600 font-bold flex items-center gap-1" data-i18n="cancel_reply_btn">
                        <i class="fa-solid fa-xmark"></i>
                        <span>Cancel</span>
                    </button>
                </div>

                <!-- Comment Input Form -->
                <form onsubmit="submitComment(event)" class="flex items-center gap-2 pt-1">
                    <input type="text" id="modal-comment-input" required maxlength="300" placeholder="Add a comment... (15s cooldown)" data-i18n-placeholder="comment_placeholder" class="flex-grow px-4 py-2.5 text-xs font-medium border border-slate-200 bg-slate-50 focus:bg-white rounded-2xl focus:ring-2 focus:ring-indigo-500 transition shadow-inner">
                    <button type="submit" id="modal-comment-submit-btn" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-2xl shadow-md transition flex items-center gap-1.5" data-i18n="comment_submit_btn">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                        <span>Send</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    
    <!-- Custom In-App Confirmation Modal (Replaces native browser confirm()) -->
    <div id="custom-confirm-modal" class="hidden fixed inset-0 z-50 items-center justify-center p-4 modal-backdrop transition-opacity duration-200 opacity-0 pointer-events-none">
        <div id="custom-confirm-box" class="bg-white rounded-3xl border border-slate-200 max-w-sm w-full p-6 shadow-2xl space-y-4 transform scale-95 transition-transform duration-200">
            <div class="flex items-center gap-3.5">
                <div id="custom-confirm-icon-bg" class="w-12 h-12 rounded-2xl bg-rose-50 border border-rose-100 flex items-center justify-center flex-shrink-0 text-rose-600 shadow-xs">
                    <i id="custom-confirm-icon" class="fa-solid fa-trash-can text-xl"></i>
                </div>
                <div>
                    <h3 id="custom-confirm-title" class="text-base font-black text-slate-900 leading-tight">Confirm Action</h3>
                    <p id="custom-confirm-message" class="text-xs text-slate-500 mt-1 leading-relaxed"></p>
                </div>
            </div>
            <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
                <button id="custom-confirm-cancel-btn" type="button" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition">
                    Cancel
                </button>
                <button id="custom-confirm-action-btn" type="button" class="px-5 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 active:bg-rose-800 text-white text-xs font-bold transition shadow-md flex items-center gap-1.5">
                    <span>Confirm</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/translations.js') }}"></script>
    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    <!-- Global Password Recovery & Hash Handler -->
    <script>
        function checkUrlAuthHashes() {
            const hash = window.location.hash;
            if (!hash) return;

            // 1. Error handling (e.g. otp_expired or access_denied)
            if (hash.includes("error_code=otp_expired") || hash.includes("error=access_denied")) {
                const params = new URLSearchParams(hash.substring(1));
                const desc = params.get("error_description") || (typeof t === "function" ? t("toast_otp_expired") : "Password reset link has expired or is invalid. Please request a new one.");
                showToast(decodeURIComponent(desc.replace(/\+/g, " ")), "error");
                history.replaceState(null, document.title, window.location.pathname);
                return;
            }

            // 2. Password recovery redirect
            if (hash.includes("type=recovery") || hash.includes("access_token=")) {
                if (!window.location.pathname.includes("/reset-password")) {
                    window.location.href = "/reset-password" + hash;
                }
            }
        }
        document.addEventListener("DOMContentLoaded", checkUrlAuthHashes);
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
