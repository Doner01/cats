{% extends "base.html" %}

{% block title %}Reset Password | CatRank{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white/95 backdrop-blur-md p-6 sm:p-8 rounded-3xl border border-slate-200/90 shadow-2xl mt-4 space-y-6">
    <div class="text-center space-y-1.5">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-emerald-50 border border-emerald-100 text-emerald-600 flex items-center justify-center text-2xl shadow-xs">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight" data-i18n="reset_password_title">Reset Password</h1>
        <p class="text-xs text-slate-500" data-i18n="reset_password_subtitle">Enter your new password below to secure your account</p>
    </div>

    <div id="reset-alert-box" class="hidden p-3 bg-amber-50 rounded-2xl border border-amber-200 text-xs text-amber-800"></div>

    <form id="reset-password-form" onsubmit="event.preventDefault(); handleResetPassword();" class="space-y-4">
        <div class="space-y-1.5">
            <label for="reset-password" class="block text-xs font-bold text-slate-700 flex items-center gap-1.5" data-i18n="new_password_label">
                <i class="fa-solid fa-lock text-indigo-500 text-xs"></i>
                <span>New Password</span>
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-key text-xs"></i>
                </div>
                <input type="password" maxlength="128" autocomplete="new-password" id="reset-password" required minlength="8" placeholder="••••••••" class="w-full pl-9 pr-10 py-2.5 text-xs font-medium border border-slate-200 bg-slate-50 hover:bg-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner transition">
                <button type="button" aria-label="Show or hide password" onclick="togglePasswordVisibility('reset-password', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition focus:outline-none">
                    <i class="fa-solid fa-eye text-xs"></i>
                </button>
            </div>
        </div>

        <div class="space-y-1.5">
            <label for="reset-confirm-password" class="block text-xs font-bold text-slate-700 flex items-center gap-1.5" data-i18n="confirm_new_password_label">
                <i class="fa-solid fa-shield-halved text-indigo-500 text-xs"></i>
                <span>Confirm New Password</span>
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-lock text-xs"></i>
                </div>
                <input type="password" maxlength="128" autocomplete="new-password" id="reset-confirm-password" required minlength="8" placeholder="••••••••" class="w-full pl-9 pr-10 py-2.5 text-xs font-medium border border-slate-200 bg-slate-50 hover:bg-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner transition">
                <button type="button" aria-label="Show or hide password" onclick="togglePasswordVisibility('reset-confirm-password', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition focus:outline-none">
                    <i class="fa-solid fa-eye text-xs"></i>
                </button>
            </div>
        </div>

        <div class="pt-2">
            <button type="submit" id="reset-btn" disabled class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold text-xs uppercase tracking-wider rounded-2xl transition shadow-md shadow-emerald-500/20 flex items-center justify-center gap-2 transform hover:-translate-y-0.5" data-i18n="reset_password_btn">
                <i class="fa-solid fa-floppy-disk text-xs"></i>
                <span>Update Password</span>
            </button>
        </div>
    </form>

    <div class="pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
        <a href="/forgot-password" class="font-bold text-indigo-600 hover:underline transition flex items-center justify-center gap-1" >
            <i class="fa-solid fa-arrow-left text-[10px]"></i>
            <span>Request a new recovery link</span>
        </a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let isRecoverySessionActive = false;

function setRecoveryReady(ready, message = '') {
    isRecoverySessionActive = ready;
    const btn = document.getElementById('reset-btn');
    const box = document.getElementById('reset-alert-box');
    if (btn) btn.disabled = !ready;
    if (box && message) {
        box.textContent = message;
        box.classList.remove('hidden');
    }
}

async function initializeRecoverySession() {
    if (typeof supabaseClient === 'undefined' || !supabaseClient) {
        setRecoveryReady(false, 'Password recovery is unavailable because authentication is not configured.');
        return;
    }

    setRecoveryReady(false, 'Verifying your recovery link...');
    const url = new URL(window.location.href);
    const code = url.searchParams.get('code');
    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const hashIsRecovery = hashParams.get('type') === 'recovery';

    try {
        if (code) {
            const { error } = await supabaseClient.auth.exchangeCodeForSession(code);
            if (error) throw error;
            history.replaceState(null, document.title, '/reset-password');
            setRecoveryReady(true, 'Recovery link verified. Choose a new password.');
            return;
        }

        if (hashIsRecovery) {
            const accessToken = hashParams.get('access_token');
            const refreshToken = hashParams.get('refresh_token');
            if (accessToken && refreshToken) {
                const { error } = await supabaseClient.auth.setSession({
                    access_token: accessToken,
                    refresh_token: refreshToken
                });
                if (error) throw error;
                history.replaceState(null, document.title, '/reset-password');
                setRecoveryReady(true, 'Recovery link verified. Choose a new password.');
            } else {
                throw new Error('Incomplete recovery link');
            }
            return;
        }
        setRecoveryReady(false, 'This page requires a valid password-recovery link. Request a new link below.');
    } catch (err) {
        setRecoveryReady(false, 'This recovery link is invalid or expired. Please request a new one.');
    }
}

function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    const icon = btn.querySelector('i');
    if (icon) {
        icon.className = isPassword ? 'fa-solid fa-eye-slash text-xs text-indigo-600' : 'fa-solid fa-eye text-xs';
    }
}
if (typeof supabaseClient !== "undefined" && supabaseClient) {
    supabaseClient.auth.onAuthStateChange((event) => {
        if (event === "PASSWORD_RECOVERY") {
            setRecoveryReady(true, 'Recovery link verified. Choose a new password.');
            history.replaceState(null, document.title, '/reset-password');
        }
    });
}
document.addEventListener('DOMContentLoaded', initializeRecoverySession);

async function handleResetPassword() {
    if (typeof supabaseClient === "undefined" || !supabaseClient) {
        showToast("Supabase client is not initialized.", "error");
        return;
    }
    const passElem = document.getElementById("reset-password");
    const confirmElem = document.getElementById("reset-confirm-password");
    const btn = document.getElementById("reset-btn");

    if (!passElem || !confirmElem) return;
    if (!isRecoverySessionActive) {
        showToast("Please use a valid password recovery link.", "error");
        return;
    }
    const password = passElem.value;
    const confirmPassword = confirmElem.value;

    if (!password) {
        showToast("Please enter a new password.", "error");
        return;
    }
    if (password.length < 8) {
        showToast("Password must be at least 8 characters.", "error");
        return;
    }
    if (password !== confirmPassword) {
        showToast("Passwords do not match.", "error");
        return;
    }

    if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i> <span>Updating...</span>';
    }

    try {
        const { error } = await supabaseClient.auth.updateUser({ password });
        if (error) {
            showToast(error.message, "error");
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk text-xs"></i> <span>Update Password</span>';
            }
        } else {
            await supabaseClient.auth.signOut();
            showToast(typeof t === "function" ? t("toast_pass_updated") : "Password updated successfully. Sign in with the new password.", "success");
            window.location.href = "/login?password_reset=1";
        }
    } catch (err) {
        showToast("Error: " + err.message, "error");
        if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk text-xs"></i> <span>Update Password</span>';
        }
    }
}
</script>
{% endblock %}
