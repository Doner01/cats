{% extends "base.html" %}

{% block title %}Reset Password | CatRank{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white/95 backdrop-blur-md p-6 sm:p-8 rounded-3xl border border-slate-200/90 shadow-2xl mt-4 space-y-6">
    <div class="text-center space-y-1.5">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-emerald-50 border border-emerald-100 text-emerald-600 flex items-center justify-center text-2xl shadow-xs">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight" data-i18n="reset_password_title">Reset Password</h1>
        <p class="text-xs text-slate-500" data-i18n="reset_password_subtitle">Enter your new password below to secure your account</p>
    </div>

    <div id="reset-alert-box" class="hidden p-3 bg-amber-50 rounded-2xl border border-amber-200 text-xs text-amber-800"></div>

    <form id="reset-password-form" onsubmit="event.preventDefault(); handleResetPassword();" class="space-y-4">
        <div class="space-y-1.5">
            <label for="reset-password" class="block text-xs font-bold text-slate-700 flex items-center gap-1.5" data-i18n="new_password_label">
                <i class="fa-solid fa-lock text-indigo-500 text-xs"></i>
                <span>New Password</span>
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-key text-xs"></i>
                </div>
                <input type="password" maxlength="128" autocomplete="new-password" id="reset-password" required minlength="8" placeholder="••••••••" class="w-full pl-9 pr-10 py-2.5 text-xs font-medium border border-slate-200 bg-slate-50 hover:bg-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner transition">
                <button type="button" aria-label="Show or hide password" onclick="togglePasswordVisibility('reset-password', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition focus:outline-none">
                    <i class="fa-solid fa-eye text-xs"></i>
                </button>
            </div>
        </div>

        <div class="space-y-1.5">
            <label for="reset-confirm-password" class="block text-xs font-bold text-slate-700 flex items-center gap-1.5" data-i18n="confirm_new_password_label">
                <i class="fa-solid fa-shield-halved text-indigo-500 text-xs"></i>
                <span>Confirm New Password</span>
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-lock text-xs"></i>
                </div>
                <input type="password" maxlength="128" autocomplete="new-password" id="reset-confirm-password" required minlength="8" placeholder="••••••••" class="w-full pl-9 pr-10 py-2.5 text-xs font-medium border border-slate-200 bg-slate-50 hover:bg-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner transition">
                <button type="button" aria-label="Show or hide password" onclick="togglePasswordVisibility('reset-confirm-password', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition focus:outline-none">
                    <i class="fa-solid fa-eye text-xs"></i>
                </button>
            </div>
        </div>

        <div class="pt-2">
            <button type="submit" id="reset-btn" disabled class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold text-xs uppercase tracking-wider rounded-2xl transition shadow-md shadow-emerald-500/20 flex items-center justify-center gap-2 transform hover:-translate-y-0.5" data-i18n="reset_password_btn">
                <i class="fa-solid fa-floppy-disk text-xs"></i>
                <span>Update Password</span>
            </button>
        </div>
    </form>

    <div class="pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
        <a href="/forgot-password" class="font-bold text-indigo-600 hover:underline transition flex items-center justify-center gap-1" >
            <i class="fa-solid fa-arrow-left text-[10px]"></i>
            <span>Request a new recovery link</span>
        </a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let isRecoverySessionActive = false;
let recoverySessionUserId = '';

function setResetAlert(message = '', type = 'info') {
    const box = document.getElementById('reset-alert-box');
    if (!box) return;
    const text = String(message || '').trim();
    box.textContent = text;
    box.className = 'p-3 rounded-2xl border text-xs leading-relaxed font-medium';
    box.classList.toggle('hidden', !text);
    if (type === 'error') box.classList.add('bg-rose-50', 'border-rose-200', 'text-rose-700');
    else if (type === 'success') box.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
    else box.classList.add('bg-amber-50', 'border-amber-200', 'text-amber-800');
}

function setRecoveryReady(ready, message = '', type = 'info', userId = '') {
    isRecoverySessionActive = Boolean(ready);
    if (userId) recoverySessionUserId = String(userId);
    const btn = document.getElementById('reset-btn');
    if (btn) btn.disabled = !ready;
    if (message) setResetAlert(message, type);
}

async function acceptRecoverySession(session, message = 'Recovery link verified. Choose a new password.') {
    if (!session?.user) throw new Error('Recovery session is missing a user.');
    history.replaceState(null, document.title, '/reset-password');
    setRecoveryReady(true, message, 'success', session.user.id);
}

async function initializeRecoverySession() {
    if (typeof supabaseClient === 'undefined' || !supabaseClient) {
        setRecoveryReady(false, 'Password recovery is unavailable because authentication is not configured.', 'error');
        return;
    }

    setRecoveryReady(false, 'Verifying your recovery link…');
    const url = new URL(window.location.href);
    const tokenHash = String(url.searchParams.get('token_hash') || '').trim();
    const type = String(url.searchParams.get('type') || '').trim().toLowerCase();
    const code = String(url.searchParams.get('code') || '').trim();
    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const hashIsRecovery = hashParams.get('type') === 'recovery';

    try {
        // Preferred CatRank v2 flow: the email links directly to CatRank with a
        // one-time TokenHash.  No local PKCE verifier is required, so opening
        // the email on another browser/device still works.
        if (tokenHash && (!type || type === 'recovery')) {
            const {data, error} = await supabaseClient.auth.verifyOtp({
                token_hash: tokenHash,
                type: 'recovery'
            });
            if (error || !data?.session) throw error || new Error('Recovery verification failed.');
            await acceptRecoverySession(data.session);
            return;
        }

        // Backward-compatible PKCE link support.  Old recovery emails created
        // before the template change can still work when the verifier exists.
        if (code) {
            const flowId = url.searchParams.get('sb_flow_id');
            const {data, error} = await supabaseClient.auth.exchangeCodeForSession(
                code,
                flowId ? {flowId} : undefined
            );
            if (error || !data?.session) throw error || new Error('Recovery code exchange failed.');
            await acceptRecoverySession(data.session);
            return;
        }

        // Backward-compatible implicit recovery links.
        if (hashIsRecovery) {
            const accessToken = hashParams.get('access_token');
            const refreshToken = hashParams.get('refresh_token');
            if (!accessToken || !refreshToken) throw new Error('Incomplete recovery link.');
            const {data, error} = await supabaseClient.auth.setSession({
                access_token: accessToken,
                refresh_token: refreshToken
            });
            if (error || !data?.session) throw error || new Error('Recovery session could not be restored.');
            await acceptRecoverySession(data.session);
            return;
        }

        setRecoveryReady(false, 'This page requires a valid password-recovery link. Request a new link below.', 'error');
    } catch (error) {
        console.warn('Recovery link verification failed:', error);
        history.replaceState(null, document.title, '/reset-password');
        setRecoveryReady(false, 'This recovery link is invalid, expired, or already used. Request a new one.', 'error');
    }
}

function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    const icon = btn?.querySelector('i');
    if (icon) icon.className = isPassword ? 'fa-solid fa-eye-slash text-xs text-indigo-600' : 'fa-solid fa-eye text-xs';
}

async function proveResetPassword(password) {
    const {data: {session}} = await supabaseClient.auth.getSession();
    if (!session?.access_token) throw new Error('The recovery session expired. Request a new link.');
    if (recoverySessionUserId && String(session.user?.id || '') !== recoverySessionUserId) {
        throw new Error('The recovery session changed. Request a new link.');
    }

    const response = await fetch('/api/auth/password-proof', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify({password})
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || 'Could not verify the new password.');
    return data;
}

async function handleResetPassword() {
    if (typeof supabaseClient === 'undefined' || !supabaseClient) {
        setResetAlert('Password recovery is temporarily unavailable.', 'error');
        return;
    }

    const passElem = document.getElementById('reset-password');
    const confirmElem = document.getElementById('reset-confirm-password');
    const btn = document.getElementById('reset-btn');
    if (!passElem || !confirmElem) return;

    if (!isRecoverySessionActive) {
        setResetAlert('Please use a valid password recovery link.', 'error');
        return;
    }

    const password = passElem.value;
    const confirmPassword = confirmElem.value;
    if (password.length < 8 || password.length > 128) {
        setResetAlert('Password must be between 8 and 128 characters.', 'error');
        passElem.focus();
        return;
    }
    if (password !== confirmPassword) {
        setResetAlert('Passwords do not match.', 'error');
        confirmElem.focus();
        return;
    }

    if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i> <span>Updating…</span>';
    }

    try {
        // The recovery token already authenticated this user.  Update the
        // password directly in Supabase Auth; CatRank never stores passwords.
        const {error} = await supabaseClient.auth.updateUser({password});
        if (error) throw error;

        // Independent proof of the new method.  This also updates CatRank's
        // server-controlled password capability marker.
        await proveResetPassword(password);
        setResetAlert('Password updated successfully. You can now sign in with email and password.', 'success');
        await supabaseClient.auth.signOut({scope: 'local'}).catch(() => null);
        setTimeout(() => window.location.replace('/login?password_reset=1'), 650);
    } catch (error) {
        setResetAlert(error.message || 'Could not update your password. Request a new recovery link and try again.', 'error');
        if (btn) btn.disabled = false;
    } finally {
        if (btn && !btn.disabled) {
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk text-xs"></i> <span>Update Password</span>';
        }
    }
}

document.addEventListener('DOMContentLoaded', initializeRecoverySession);
</script>
{% endblock %}
