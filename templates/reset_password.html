{% extends "base.html" %}

{% block title %}Reset Password | CatRank{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white/95 backdrop-blur-md p-6 sm:p-8 rounded-3xl border border-slate-200/90 shadow-2xl mt-4 space-y-6">
    <div class="text-center space-y-1.5">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-emerald-50 border border-emerald-100 text-emerald-600 flex items-center justify-center text-2xl shadow-xs">
            <i class="fa-solid fa-shield-check"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight" data-i18n="reset_password_title">Reset Password</h1>
        <p class="text-xs text-slate-500" data-i18n="reset_password_subtitle">Enter your new password below to secure your account</p>
    </div>

    <!-- Alert / Notice Box -->
    <div id="reset-alert-box" class="hidden p-3 bg-amber-50 rounded-2xl border border-amber-200 text-xs text-amber-800"></div>
    <div id="reset-session-status" class="p-3 bg-slate-50 rounded-2xl border border-slate-200 text-xs text-slate-500">
        <i class="fa-solid fa-spinner fa-spin text-indigo-500 mr-1.5"></i>
        <span>Verifying your password reset link...</span>
    </div>

    <form onsubmit="event.preventDefault(); handleResetPassword();" class="space-y-4">
        <div class="space-y-1.5">
            <label class="block text-xs font-bold text-slate-700 flex items-center gap-1.5" data-i18n="new_password_label">
                <i class="fa-solid fa-lock text-indigo-500 text-xs"></i>
                <span>New Password</span>
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-key text-xs"></i>
                </div>
                <input type="password" id="reset-password" required minlength="6" placeholder="••••••••" class="w-full pl-9 pr-10 py-2.5 text-xs font-medium border border-slate-200 bg-slate-50 hover:bg-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner transition">
                <button type="button" onclick="togglePasswordVisibility('reset-password', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition focus:outline-none">
                    <i class="fa-solid fa-eye text-xs"></i>
                </button>
            </div>
        </div>

        <div class="space-y-1.5">
            <label class="block text-xs font-bold text-slate-700 flex items-center gap-1.5" data-i18n="confirm_new_password_label">
                <i class="fa-solid fa-shield-check text-indigo-500 text-xs"></i>
                <span>Confirm New Password</span>
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-lock text-xs"></i>
                </div>
                <input type="password" id="reset-confirm-password" required minlength="6" placeholder="••••••••" class="w-full pl-9 pr-10 py-2.5 text-xs font-medium border border-slate-200 bg-slate-50 hover:bg-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner transition">
                <button type="button" onclick="togglePasswordVisibility('reset-confirm-password', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition focus:outline-none">
                    <i class="fa-solid fa-eye text-xs"></i>
                </button>
            </div>
        </div>

        <div class="pt-2">
            <button type="submit" id="reset-btn" disabled class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold text-xs uppercase tracking-wider rounded-2xl transition shadow-md shadow-emerald-500/20 flex items-center justify-center gap-2 transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed" data-i18n="reset_password_btn">
                <i class="fa-solid fa-floppy-disk text-xs"></i>
                <span>Update Password</span>
            </button>
        </div>
    </form>

    <div class="pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
        <a href="/login" class="font-bold text-indigo-600 hover:underline transition flex items-center justify-center gap-1" data-i18n="back_to_login">
            <i class="fa-solid fa-arrow-left text-[10px]"></i>
            <span>Back to Sign In</span>
        </a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let isRecoverySessionActive = false;

function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    const icon = btn.querySelector('i');
    if (icon) {
        icon.className = isPassword ? 'fa-solid fa-eye-slash text-xs text-indigo-600' : 'fa-solid fa-eye text-xs';
    }
}

function setResetUi(ready, message, isError = false) {
    const status = document.getElementById("reset-session-status");
    const alertBox = document.getElementById("reset-alert-box");
    const btn = document.getElementById("reset-btn");

    if (status) {
        status.className = ready
            ? "hidden"
            : (isError
                ? "p-3 bg-rose-50 rounded-2xl border border-rose-200 text-xs text-rose-700"
                : "p-3 bg-slate-50 rounded-2xl border border-slate-200 text-xs text-slate-500");
        if (!ready) {
            status.innerHTML = isError
                ? `<i class="fa-solid fa-circle-exclamation text-rose-500 mr-1.5"></i>${message}`
                : `<i class="fa-solid fa-spinner fa-spin text-indigo-500 mr-1.5"></i>${message}`;
        }
    }
    if (alertBox && isError) {
        alertBox.innerHTML = message;
        alertBox.classList.remove("hidden");
    }
    if (btn) btn.disabled = !ready;
}

async function initializeRecoverySession() {
    if (typeof supabaseClient === "undefined" || !supabaseClient) {
        setResetUi(false, "Supabase client is not initialized.", true);
        return;
    }

    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
    if (hashParams.get("error") || hashParams.get("error_code")) {
        const errorText = hashParams.get("error_description") || "This password reset link is invalid or expired. Please request a new one.";
        setResetUi(false, escapeHtml(decodeURIComponent(errorText.replace(/\+/g, " "))), true);
        return;
    }

    if (hashParams.get("type") !== "recovery") {
        setResetUi(false, "Please open the password reset link from your email.", true);
        return;
    }

    // Supabase JS processes the recovery hash into a temporary authenticated session.
    // Listen for PASSWORD_RECOVERY and also check the session after initialization so
    // the form cannot submit unless a real recovery session exists.
    try {
        const { data, error } = await supabaseClient.auth.getSession();
        if (!error && data && data.session) {
            isRecoverySessionActive = true;
            setResetUi(true);
            history.replaceState(null, document.title, window.location.pathname);
            return;
        }
    } catch (e) {
        console.warn("Recovery session lookup failed:", e);
    }

    setTimeout(async () => {
        if (isRecoverySessionActive) return;
        try {
            const { data, error } = await supabaseClient.auth.getSession();
            if (!error && data && data.session) {
                isRecoverySessionActive = true;
                setResetUi(true);
                history.replaceState(null, document.title, window.location.pathname);
                return;
            }
        } catch (e) {
            console.warn("Recovery session retry failed:", e);
        }

        setResetUi(false, "This password reset link is invalid or expired. Please request a new one.", true);
    }, 800);
}

if (typeof supabaseClient !== "undefined" && supabaseClient) {
    supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY" && session) {
            isRecoverySessionActive = true;
            setResetUi(true);
            history.replaceState(null, document.title, window.location.pathname);
        }
    });
}

async function handleResetPassword() {
    if (typeof supabaseClient === "undefined" || !supabaseClient) {
        showToast("Supabase client is not initialized.", "error");
        return;
    }
    if (!isRecoverySessionActive) {
        showToast("This password reset link is invalid or expired.", "error");
        return;
    }

    const passElem = document.getElementById("reset-password");
    const confirmElem = document.getElementById("reset-confirm-password");
    const btn = document.getElementById("reset-btn");

    if (!passElem || !confirmElem) return;
    const password = passElem.value;
    const confirmPassword = confirmElem.value;

    if (!password) {
        showToast("Please enter a new password.", "error");
        return;
    }
    if (password.length < 6) {
        showToast("Password must be at least 6 characters.", "error");
        return;
    }
    if (password !== confirmPassword) {
        showToast("Passwords do not match.", "error");
        return;
    }

    if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i> <span>Updating...</span>';
    }

    try {
        const { error } = await supabaseClient.auth.updateUser({ password });
        if (error) {
            showToast(error.message, "error");
            return;
        }

        // Repair/ensure the public profile while the recovery session is still authenticated.
        try {
            const sessionRes = await supabaseClient.auth.getSession();
            const recoverySession = sessionRes && sessionRes.data ? sessionRes.data.session : null;
            if (recoverySession && recoverySession.access_token) {
                await fetch("/api/user/profile/ensure", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${recoverySession.access_token}` }
                });
            }
        } catch (profileErr) {
            console.warn("Profile ensure after password reset failed:", profileErr);
        }

        showToast(typeof t === "function" ? t("toast_pass_updated") : "Password updated successfully!", "success");

        // End the temporary recovery session so the user starts with a clean login.
        try {
            await supabaseClient.auth.signOut({ scope: "local" });
        } catch (signOutErr) {
            console.warn("Recovery session sign-out failed:", signOutErr);
        }

        setTimeout(() => {
            window.location.href = "/login";
        }, 800);
    } catch (err) {
        showToast("Error: " + (err && err.message ? err.message : err), "error");
        if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk text-xs"></i> <span>Update Password</span>';
        }
    }
}

document.addEventListener("DOMContentLoaded", initializeRecoverySession);
</script>
{% endblock %}
