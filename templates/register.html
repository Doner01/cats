{% extends "base.html" %}

{% block title %}Create Account | CatRank{% endblock %}

<script>
if (typeof supabaseClient !== "undefined" && supabaseClient) {
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
        if (session && session.user) {
            window.location.replace("/");
        }
    });
}
</script>
{% block content %}
<div class="max-w-lg mx-auto bg-white/95 backdrop-blur-md p-6 sm:p-8 rounded-3xl border border-slate-200/90 shadow-xl mt-4 space-y-6">
    <div class="text-center space-y-1.5">
        <!-- Live Avatar Seed/Custom Preview -->
        <div class="relative w-20 h-20 mx-auto mb-2 group">
            <img id="reg-avatar-preview" src="https://api.dicebear.com/7.x/bottts/svg?seed=CatWhisperer&backgroundColor=b6e3f4,c0aede,d1d4f9" alt="Avatar" class="w-20 h-20 rounded-full border-2 border-indigo-200 bg-slate-50 object-cover shadow-sm transition-transform duration-300">
            <label for="reg-avatar-file" class="absolute inset-0 bg-black/40 text-white rounded-full flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition cursor-pointer text-[10px] font-bold">
                <i class="fa-solid fa-camera text-xs mb-0.5"></i>
                <span data-i18n="change_photo">Upload</span>
            </label>
            <input type="file" id="reg-avatar-file" accept="image/png, image/jpeg, image/webp" class="hidden" onchange="handleRegAvatarSelect(this)">
            <div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-indigo-600 text-white flex items-center justify-center text-[10px] shadow-xs">
                <i class="fa-solid fa-sparkles"></i>
            </div>
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight" data-i18n="join_community_title">Join CatRank</h1>
        <p class="text-xs text-slate-500" data-i18n="register_subtitle">Create an account to upload, vote, and share cat pictures</p>
    </div>

    <form onsubmit="event.preventDefault(); handleSignUp();" class="space-y-4">
        <!-- Display Name -->
        <div class="space-y-1.5">
            <label class="block text-xs font-bold text-slate-700 flex items-center gap-1.5" data-i18n="display_name_label">
                <i class="fa-solid fa-user text-indigo-500 text-xs"></i>
                <span>Display Name / Username</span>
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-user-tag text-xs"></i>
                </div>
                <input type="text" id="reg-display-name" required maxlength="40" oninput="updateAvatarPreview(this.value)" placeholder="e.g. CatWhisperer" data-i18n-placeholder="display_name_placeholder" class="w-full pl-9 pr-4 py-2.5 text-xs font-medium border border-slate-200 bg-slate-50 hover:bg-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner transition">
            </div>
        </div>

        <!-- Email Address -->
        <div class="space-y-1.5">
            <label class="block text-xs font-bold text-slate-700 flex items-center gap-1.5" data-i18n="email_label">
                <i class="fa-solid fa-envelope text-indigo-500 text-xs"></i>
                <span>Email Address</span>
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-at text-xs"></i>
                </div>
                <input type="email" id="reg-email" required placeholder="you@example.com" class="w-full pl-9 pr-4 py-2.5 text-xs font-medium border border-slate-200 bg-slate-50 hover:bg-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner transition">
            </div>
        </div>

        <!-- Optional Phone Number -->
        <div class="space-y-1.5">
            <div class="flex items-center justify-between">
                <label class="block text-xs font-bold text-slate-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-phone text-indigo-500 text-xs"></i>
                    <span data-i18n="phone_label">Phone Number</span>
                </label>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider bg-slate-100 px-2 py-0.5 rounded-full" data-i18n="optional_badge">Optional</span>
            </div>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-mobile-screen text-xs"></i>
                </div>
                <input type="tel" id="reg-phone" placeholder="+998 90 123 45 67" data-i18n-placeholder="phone_placeholder" class="w-full pl-9 pr-4 py-2.5 text-xs font-medium border border-slate-200 bg-slate-50 hover:bg-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner transition">
            </div>
        </div>

        <!-- Optional Bio -->
        <div class="space-y-1.5">
            <div class="flex items-center justify-between">
                <label class="block text-xs font-bold text-slate-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-quote-left text-indigo-500 text-xs"></i>
                    <span data-i18n="bio_label">Short Bio</span>
                </label>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider bg-slate-100 px-2 py-0.5 rounded-full" data-i18n="optional_badge">Optional</span>
            </div>
            <input type="text" id="reg-bio" maxlength="150" placeholder="Tell us about your love for cats..." data-i18n-placeholder="bio_placeholder" class="w-full px-4 py-2.5 text-xs font-medium border border-slate-200 bg-slate-50 hover:bg-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner transition">
        </div>

        <!-- Password -->
        <div class="space-y-1.5">
            <label class="block text-xs font-bold text-slate-700 flex items-center gap-1.5" data-i18n="password_label">
                <i class="fa-solid fa-lock text-indigo-500 text-xs"></i>
                <span>Password</span>
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-key text-xs"></i>
                </div>
                <input type="password" id="reg-password" required minlength="6" placeholder="••••••••" class="w-full pl-9 pr-10 py-2.5 text-xs font-medium border border-slate-200 bg-slate-50 hover:bg-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner transition">
                <button type="button" onclick="togglePasswordVisibility('reg-password', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition focus:outline-none">
                    <i class="fa-solid fa-eye text-xs"></i>
                </button>
            </div>
        </div>

        <!-- Confirm Password -->
        <div class="space-y-1.5">
            <label class="block text-xs font-bold text-slate-700 flex items-center gap-1.5" data-i18n="confirm_password_label">
                <i class="fa-solid fa-shield-check text-indigo-500 text-xs"></i>
                <span>Confirm Password</span>
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-lock text-xs"></i>
                </div>
                <input type="password" id="reg-confirm-password" required minlength="6" placeholder="••••••••" class="w-full pl-9 pr-10 py-2.5 text-xs font-medium border border-slate-200 bg-slate-50 hover:bg-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner transition">
                <button type="button" onclick="togglePasswordVisibility('reg-confirm-password', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition focus:outline-none">
                    <i class="fa-solid fa-eye text-xs"></i>
                </button>
            </div>
        </div>

        <div class="pt-2">
            <button type="submit" id="register-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold text-xs uppercase tracking-wider rounded-2xl transition shadow-md shadow-indigo-500/20 flex items-center justify-center gap-2 transform hover:-translate-y-0.5" data-i18n="signup_submit_btn">
                <i class="fa-solid fa-user-plus text-xs"></i>
                <span>Create Account</span>
            </button>
        </div>
    </form>

    <div class="pt-4 border-t border-slate-100 text-center text-xs text-slate-500 flex flex-col sm:flex-row items-center justify-center gap-1.5">
        <span data-i18n="has_account_text">Already have an account?</span>
        <a href="/login" class="font-bold text-indigo-600 hover:underline transition flex items-center gap-1" data-i18n="goto_login_link">
            <span>Sign In here</span>
            <i class="fa-solid fa-arrow-right text-[10px]"></i>
        </a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let customAvatarDataUrl = null;

function updateAvatarPreview(name) {
    if (customAvatarDataUrl) return; // keep user uploaded avatar
    const preview = document.getElementById("reg-avatar-preview");
    if (!preview) return;
    const safeName = (name || "CatWhisperer").trim();
    preview.src = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(safeName)}&backgroundColor=b6e3f4,c0aede,d1d4f9`;
}

function handleRegAvatarSelect(input) {
    if (!input || !input.files || input.files.length === 0) return;
    const file = input.files[0];
    const allowed = ['image/jpeg', 'image/png', 'image/webp'];
    if (!allowed.includes(file.type)) {
        showToast(typeof t === 'function' ? t('file_error_invalid_type') : "Invalid image type. Please choose JPG, PNG, or WEBP.", "error");
        input.value = "";
        return;
    }
    if (file.size > 5 * 1024 * 1024) {
        showToast(typeof t === 'function' ? t('file_error_too_large') : "Image exceeds 5MB limit.", "error");
        input.value = "";
        return;
    }
    const reader = new FileReader();
    reader.onload = function(e) {
        customAvatarDataUrl = e.target.result;
        const preview = document.getElementById("reg-avatar-preview");
        if (preview) preview.src = customAvatarDataUrl;
    };
    reader.readAsDataURL(file);
}

function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    const icon = btn.querySelector('i');
    if (icon) {
        icon.className = isPassword ? 'fa-solid fa-eye-slash text-xs text-indigo-600' : 'fa-solid fa-eye text-xs';
    }
}
</script>
{% endblock %}
