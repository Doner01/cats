{% extends "base.html" %}

{% block title %}Forgot Password | CatRank{% endblock %}

<script>
if (typeof supabaseClient !== "undefined" && supabaseClient) {
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
        if (session && session.user) {
            window.location.replace("/");
        }
    });
}
</script>
{% block content %}
<div class="max-w-md mx-auto bg-white/95 backdrop-blur-md p-6 sm:p-8 rounded-3xl border border-slate-200/90 shadow-2xl mt-4 space-y-6">
    <div class="text-center space-y-1.5">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-50 border border-amber-100 text-amber-600 flex items-center justify-center text-2xl shadow-xs">
            <i class="fa-solid fa-key"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight" data-i18n="forgot_password_title">Forgot Password?</h1>
        <p class="text-xs text-slate-500" data-i18n="forgot_password_subtitle">Enter your email and we will send you a password reset link</p>
    </div>

    <div id="forgot-alert-box" class="hidden p-3.5 bg-indigo-50 border border-indigo-200 rounded-2xl text-xs text-indigo-800 leading-relaxed"></div>

    <form onsubmit="event.preventDefault(); handleForgotPassword();" class="space-y-4">
        <div class="space-y-1.5">
            <label for="forgot-email" class="block text-xs font-bold text-slate-700 flex items-center gap-1.5" data-i18n="email_label">
                <i class="fa-solid fa-envelope text-indigo-500 text-xs"></i>
                <span>Email Address</span>
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-at text-xs"></i>
                </div>
                <input type="email" autocomplete="email" id="forgot-email" required placeholder="you@example.com" class="w-full pl-9 pr-4 py-2.5 text-xs font-medium border border-slate-200 bg-slate-50 hover:bg-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner transition">
            </div>
        </div>

        <div class="pt-2">
            <button type="submit" id="forgot-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold text-xs uppercase tracking-wider rounded-2xl transition shadow-md shadow-indigo-500/20 flex items-center justify-center gap-2 transform hover:-translate-y-0.5" data-i18n="forgot_password_btn">
                <i class="fa-solid fa-paper-plane text-xs"></i>
                <span>Send Reset Link</span>
            </button>
        </div>
    </form>

    <div class="pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
        <a href="/login" class="font-bold text-indigo-600 hover:underline transition flex items-center justify-center gap-1" data-i18n="back_to_login">
            <i class="fa-solid fa-arrow-left text-[10px]"></i>
            <span>Back to Sign In</span>
        </a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function setForgotAlert(message = "", type = "info") {
    const box = document.getElementById("forgot-alert-box");
    if (!box) return;
    const text = String(message || "").trim();
    box.textContent = text;
    box.classList.toggle("hidden", !text);
    box.className = "p-3.5 rounded-2xl border text-xs leading-relaxed font-medium";
    if (type === "error") box.classList.add("bg-rose-50", "border-rose-200", "text-rose-700");
    else if (type === "success") box.classList.add("bg-emerald-50", "border-emerald-200", "text-emerald-700");
    else box.classList.add("bg-indigo-50", "border-indigo-200", "text-indigo-800");
}
async function handleForgotPassword() {
    if (typeof supabaseClient === "undefined" || !supabaseClient) {
        setForgotAlert(currentLang === "ru" ? "Восстановление пароля временно недоступно." : "Password recovery is temporarily unavailable.", "error");
        return;
    }
    const emailElem = document.getElementById("forgot-email");
    const btn = document.getElementById("forgot-btn");

    if (!emailElem) return;
    const email = emailElem.value.trim();
    setForgotAlert();

    if (!email) {
        setForgotAlert(typeof t === "function" && currentLang === "ru" ? "Введите email." : "Please enter your email address.", "error");
        emailElem.focus();
        return;
    }

    if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i> <span>Sending link...</span>';
    }

    try {
        let error = null;
        try { await authRequest('/api/auth/password-reset', {email}); }
        catch (failure) { error = failure; }
        if (error) {
            const message = error.message.toLowerCase().includes("rate limit") || error.status === 429
                ? (typeof t === "function" ? t("toast_email_rate_limit") : "Too many reset requests. Please wait and try again.")
                : error.message;
            setForgotAlert(message, "error");
        } else {
            setForgotAlert(
                currentLang === "ru"
                    ? `Если аккаунт для ${email} существует, ссылка для сброса отправлена. Проверьте входящие и спам.`
                    : `If an account exists for ${email}, a reset link has been sent. Check your inbox and spam folder.`,
                "success"
            );
            emailElem.value = "";
        }
    } catch (err) {
        setForgotAlert((currentLang === "ru" ? "Не удалось отправить ссылку: " : "Could not send the reset link: ") + err.message, "error");
    } finally {
        if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane text-xs"></i> <span>' + (typeof t === "function" ? t("forgot_password_btn") : "Send Reset Link") + '</span>';
        }
    }
}
</script>
{% endblock %}
